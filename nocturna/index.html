<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Tailwind CLI</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-slate-950 text-slate-100 flex min-h-screen items-center justify-center p-4">

    <main class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl p-8 md:p-12 text-center shadow-2xl space-y-6">

        <header class="space-y-4">
            <p class="inline-block bg-amber-400/10 text-amber-400 border border-amber-400/20 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider">
                Nuevo &middot; Jueves a sábado
            </p>

            <h1 class="text-4xl md:text-5xl font-extrabold text-white tracking-tight leading-tight">
                Rueda Nocturna
            </h1>

            <p class="text-slate-300 text-lg md:text-xl leading-relaxed max-w-lg mx-auto">
                Descubre Medellín en bici cuando se encienden las luces
            </p>
        </header>

        <dl class="grid grid-cols-2 gap-4 max-w-md mx-auto my-6">
            <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-xl">
                <dd class="text-2xl font-bold text-white">3 rutas</dd>
                <dt class="text-xs text-slate-400 uppercase tracking-wide">Guiadas</dt>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-xl">
                <dd class="text-2xl font-bold text-emerald-400">Desde $55.000</dd>
                <dt class="text-xs text-slate-400 uppercase tracking-wide">Por persona</dt>
            </div>
        </dl>

        <nav aria-label="Acciones de la campaña" class="flex flex-wrap items-center justify-center gap-3 pt-2">
            <a href="#" class="inline-block bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-6 py-3 rounded-xl text-sm uppercase tracking-wider transition duration-200 shadow-lg shadow-emerald-500/20 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 focus:ring-offset-slate-900">
                Inscríbete
            </a>
            <a href="#" class="inline-block bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-6 py-3 rounded-xl text-sm uppercase tracking-wider transition duration-200 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 focus:ring-offset-slate-900">
                Ver rutas
            </a>
            <a href="#" class="inline-block bg-transparent hover:bg-slate-800/60 text-emerald-400 border border-emerald-500/50 hover:border-emerald-400 font-semibold px-6 py-3 rounded-xl text-sm uppercase tracking-wider transition duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 focus:ring-offset-slate-900">
                Alquilar bici
            </a>
        </nav>

    </main>

</body>
</html>
