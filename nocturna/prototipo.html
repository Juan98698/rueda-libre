<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Prototipo Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex min-h-screen items-center justify-center p-4">

    <section class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl p-8 md:p-12 text-center shadow-2xl space-y-6">

        <div>
            <span class="inline-block bg-amber-400/10 text-amber-400 border border-amber-400/20 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider">
                Nuevo &middot; Jueves a sábado
            </span>
        </div>
        <h1 class="text-4xl md:text-5xl font-extrabold text-white tracking-tight leading-tight">
            Rueda Nocturna
        </h1>

        <p class="text-slate-300 text-lg md:text-xl leading-relaxed max-w-lg mx-auto">
            Descubre Medellín en bici cuando se encienden las luces
        </p>
        <div class="grid grid-cols-2 gap-4 max-w-md mx-auto my-6">
            <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-xl">
                <p class="text-2xl font-bold text-white">3 rutas</p>
                <p class="text-xs text-slate-400 uppercase tracking-wide">Guiadas</p>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-xl">
                <p class="text-2xl font-bold text-emerald-400">Desde $55.000</p>
                <p class="text-xs text-slate-400 uppercase tracking-wide">Por persona</p>
            </div>
        </div>

        <div>
            <a href="#" class="inline-block bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-8 py-3.5 rounded-xl text-base tracking-wide uppercase transition duration-200 shadow-lg shadow-emerald-500/20">
                Inscríbete
            </a>
        </div>

    </section>

</body>
</html>
